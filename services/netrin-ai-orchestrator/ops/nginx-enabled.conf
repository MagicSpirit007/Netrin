# Public same-origin proxy for the loopback-only Netrin AI Orchestrator.

location = /v1/ai-route/providers {
    client_max_body_size 1k;
    limit_req zone=netrin_ai_registry burst=20 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:8787;
}

location = /v1/ai-route/analyze {
    client_max_body_size 1m;
    client_body_timeout 15s;
    limit_req zone=netrin_ai_compute burst=8 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 105s;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:8787;
}

location = /v1/ai-route/plan {
    client_max_body_size 256k;
    client_body_timeout 15s;
    limit_req zone=netrin_ai_compute burst=8 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_send_timeout 20s;
    proxy_read_timeout 105s;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:8787;
}

location = /v1/ai-route/model-catalog {
    client_max_body_size 32k;
    client_body_timeout 10s;
    limit_req zone=netrin_ai_catalog burst=4 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:8787;
}

location = /v1/ai-route/provider-probe {
    client_max_body_size 32k;
    client_body_timeout 10s;
    limit_req zone=netrin_ai_probe burst=2 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:8787;
}

# Keep health/configuration and any future undeclared route private by default.
location ^~ /v1/ai-route/ {
    return 404;
}
