# Per-IP outer limits. The service applies independent authenticated-user limits too.
limit_req_zone $binary_remote_addr zone=netrin_ai_registry:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=netrin_ai_compute:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=netrin_ai_catalog:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=netrin_ai_probe:10m rate=6r/m;
