# Example only. Replace domain, certificate, upstream, and root values.
# This server must be the final trusted hop before Supabase. It overwrites
# client-supplied proxy headers so Edge Functions may treat X-Real-IP as a
# trusted rate-limit input.

server {
    listen 443 ssl http2;
    server_name netrin.example.com;

    ssl_certificate /etc/ssl/example/fullchain.pem;
    ssl_certificate_key /etc/ssl/example/privkey.pem;

    location ^~ /netrin/ {
        alias /srv/netrin/current/;
        try_files $uri $uri/ /netrin/index.html;
    }

    location ^~ /functions/v1/ {
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 150s;

        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8000;
    }
}
