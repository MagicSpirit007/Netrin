name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/
      - name: Check third-party licenses
        run: npm run licenses:check
      - name: Validate cell contract
        run: npm run validate:cell
      - name: Lint with Biome
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run application tests
        run: npm test
      - name: Check shell files
        run: npm run shell:check
      - name: Validate appearance contracts
        run: npm run validate:appearance
      - name: Build and scan production bundle
        run: npm run build
      - name: Run 390x844 browser smoke test
        run: npm run test:smoke

  ai-service:
    name: AI service quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/netrin-ai-orchestrator
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: services/netrin-ai-orchestrator/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org/
      - name: Type check
        run: npm run typecheck
      - name: Run service tests
        run: npm test

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full pull-request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - name: Verify Signed-off-by trailers
        run: node scripts/check-dco.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
