name: Bug report
description: Report a reproducible problem in Netrin
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not disclose security vulnerabilities here. Use private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.2 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, viewport, and relevant configuration without secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, phone numbers, coordinates, and other sensitive data.
