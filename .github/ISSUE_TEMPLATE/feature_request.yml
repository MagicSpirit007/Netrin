name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data, assets, or external services
      description: List sources, licenses, privacy effects, and provider dependencies.
